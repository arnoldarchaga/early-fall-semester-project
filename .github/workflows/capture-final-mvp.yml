name: Capture Final MVP Screenshots
on:
  push:
    paths:
      - '.github/workflows/capture-final-mvp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Verify and capture live site
        run: |
          cat > capture.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const assert=require('assert/strict');
          (async()=>{
            const url='https://arnoldarchaga.github.io/early-fall-semester-project/';
            let ready=false;
            for(let i=0;i<40;i++){
              const r=await fetch(url+'?verify='+Date.now());
              const html=await r.text();
              if(r.ok && html.includes('Find your first step')){ready=true;break;}
              await new Promise(r=>setTimeout(r,5000));
            }
            assert(ready,'Updated GitHub Pages site must be live');
            const browser=await chromium.launch();
            const page=await browser.newPage({viewport:{width:1440,height:1000},reducedMotion:'reduce'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto(url,{waitUntil:'networkidle'});
            assert.equal(response.status(),200);
            await page.locator('.career-card').first().waitFor();
            assert.equal(await page.locator('.career-card').count(),4);
            fs.mkdirSync('screenshots',{recursive:true});
            await page.screenshot({path:'screenshots/01-live-desktop-home.png',fullPage:false});
            for(const id of ['support','development','data','security']){
              await page.locator('[data-filter="'+id+'"]').click();
              assert.equal(await page.locator('.career-card:visible').count(),1);
            }
            await page.locator('[data-filter="support"]').click();
            await page.locator('.career-card:visible summary').click();
            await page.locator('#paths').evaluate(el=>el.scrollIntoView({block:'start'}));
            await page.screenshot({path:'screenshots/02-live-career-profile.png',fullPage:false});
            await page.selectOption('#first-path','data');await page.selectOption('#second-path','development');
            assert.equal(await page.locator('#first-result h3').innerText(),'Data Analysis');
            assert.equal(await page.locator('#second-result h3').innerText(),'Software Development');
            await page.locator('#compare').evaluate(el=>el.scrollIntoView({block:'start'}));
            await page.screenshot({path:'screenshots/03-live-career-comparison.png',fullPage:false});
            await page.selectOption('#plan-path','data');
            await page.locator('[data-task="data-0"]').check();
            await page.reload({waitUntil:'networkidle'});
            await page.selectOption('#plan-path','data');
            assert(await page.locator('[data-task="data-0"]').isChecked());
            for(const width of [390,768,1024,1440]){
              await page.setViewportSize({width,height:1000});
              assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),'No overflow at '+width);
            }
            await page.setViewportSize({width:390,height:844});
            await page.locator('#getting-started').screenshot({path:'screenshots/04-live-mobile-plan.png'});
            assert.deepEqual(errors,[]);
            fs.writeFileSync('screenshots/CAPTURE-DETAILS.txt','Captured from: '+url+'\nCaptured at: '+new Date().toISOString()+'\nThe mobile image captures the complete plan section at a 390px viewport.\nLive checks passed: HTTP 200, 4 profiles, all filters, comparison updates, checklist persistence, no horizontal overflow at 4 widths, no JavaScript page errors.\n');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          
          JS
          node capture.cjs
      - name: Save submission screenshots
        uses: actions/upload-artifact@v4
        with:
          name: CMPA-4303-Live-Screenshots
          path: screenshots/
          retention-days: 30
